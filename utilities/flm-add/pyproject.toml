[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flm-add"
version = "0.2.0"
description = "Install a pre-converted FLM (Q4NX) model and register it with FastFlowLM"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = ["flm", "fastflowlm", "q4nx", "npu", "model-install"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
flm-add = "flm_add:main"

[tool.setuptools]
packages = ["flm_add"]
