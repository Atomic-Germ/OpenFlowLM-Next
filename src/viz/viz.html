<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFlowLM Flow Viz</title>
<style>
/*VIZ_FONTS*/
:root {
  --bg: #06080b; --bg2: #0b0f14; --panel: rgba(13, 17, 23, 0.86); --panel2: #10151c;
  --line: #1c242e; --line2: #2a3542; --ink: #dfe7ef; --dim: #8593a1; --faint: #46525e;
  --tile: #0d1218; --tileEdge: #243040; --tileUsed: #111a24;
  --weight: #f2b33d; --act: #3fd6e8; --state: #b98cff; --out: #6fe39a;
  --host: #5aa8ff; --ctx: #7d8896; --lin: #2cc7b0; --att: #ff8b3f; --tail: #ff5fa8; --idle: #3a4552;
  --grid: rgba(120, 160, 200, 0.045); --playhead: #ffffff;
  --display: 'Chakra Petch', 'Bahnschrift', 'DejaVu Sans', sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Mono', 'DejaVu Sans Mono', monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #efebe2; --bg2: #e6e1d6; --panel: rgba(250, 248, 243, 0.9); --panel2: #f7f4ee;
  --line: #d6cfc2; --line2: #c3baab; --ink: #1d232a; --dim: #5d6670; --faint: #a39b8e;
  --tile: #f6f2ea; --tileEdge: #c5bcac; --tileUsed: #fffdf8;
  --weight: #b87400; --act: #0a8ea0; --state: #7a4fd6; --out: #1f9c55;
  --host: #2a6fd6; --ctx: #8a8173; --lin: #0e8f7d; --att: #d4601a; --tail: #c42c7a; --idle: #c9c1b3;
  --grid: rgba(60, 50, 30, 0.06); --playhead: #111111;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #efebe2; --bg2: #e6e1d6; --panel: rgba(250, 248, 243, 0.9); --panel2: #f7f4ee;
    --line: #d6cfc2; --line2: #c3baab; --ink: #1d232a; --dim: #5d6670; --faint: #a39b8e;
    --tile: #f6f2ea; --tileEdge: #c5bcac; --tileUsed: #fffdf8;
    --weight: #b87400; --act: #0a8ea0; --state: #7a4fd6; --out: #1f9c55;
    --host: #2a6fd6; --ctx: #8a8173; --lin: #0e8f7d; --att: #d4601a; --tail: #c42c7a; --idle: #c9c1b3;
    --grid: rgba(60, 50, 30, 0.06); --playhead: #111111;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { overflow-x: hidden; }
body {
  background:
    radial-gradient(1200px 700px at 55% 35%, color-mix(in srgb, var(--act) 6%, transparent), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--bg);
  color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
#app {
  display: grid; height: 100vh; gap: 10px; padding: 10px 12px 12px;
  grid-template-columns: 236px minmax(0, 1fr) 356px;
  grid-template-rows: auto minmax(360px, 1fr) auto;
  grid-template-areas: "top top top" "layers stage explain" "tl tl tl";
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
header.top { grid-area: top; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 4px 4px 2px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 30px; height: 30px; border-radius: 7px; flex: none; position: relative;
  background: conic-gradient(from 210deg, var(--weight), var(--act), var(--state), var(--out), var(--weight));
  box-shadow: 0 0 18px color-mix(in srgb, var(--act) 40%, transparent); }
.mark::after { content: ""; position: absolute; inset: 5px; border-radius: 4px; background: var(--bg);
  background-image: linear-gradient(var(--line2) 1px, transparent 1px), linear-gradient(90deg, var(--line2) 1px, transparent 1px);
  background-size: 5px 5px; }
.eyebrow { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--line2); border-radius: 999px; color: var(--dim); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.modes { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.mode { background: transparent; border: 0; padding: 6px 12px; cursor: pointer; color: var(--dim); font-size: 12.5px; letter-spacing: .04em; }
.mode.on { background: color-mix(in srgb, var(--act) 16%, transparent); color: var(--ink); }
.mode:disabled { cursor: not-allowed; opacity: .55; }
.badge { border: 1px dashed color-mix(in srgb, var(--weight) 70%, transparent); color: var(--weight); background: transparent;
  border-radius: 6px; padding: 5px 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
.icon { background: transparent; border: 1px solid var(--line2); border-radius: 8px; width: 34px; height: 32px; cursor: pointer; color: var(--dim); }
.icon:hover, .badge:hover, .mode:not(:disabled):hover { filter: brightness(1.25); }

aside.layers { grid-area: layers; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px 8px; font-size: 10.5px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); }
.sec-h span { font-family: var(--mono); letter-spacing: 0; text-transform: none; }
#layer-list { list-style: none; margin: 0; padding: 6px 6px 10px; overflow-y: auto; flex: 1; scrollbar-width: thin; }
#layer-list li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px;
  cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--dim); position: relative; }
#layer-list li:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
#layer-list li .ix { color: var(--faint); text-align: right; }
#layer-list li .ty { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
#layer-list li .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
#layer-list li .pr { display: flex; gap: 3px; }
#layer-list li .pr i { width: 5px; height: 12px; border-radius: 1.5px; background: var(--line2); }
#layer-list li.done { color: var(--faint); }
#layer-list li.done .pr i { background: color-mix(in srgb, var(--dim) 45%, transparent); }
#layer-list li.cur { color: var(--ink); background: color-mix(in srgb, var(--act) 12%, transparent); }
#layer-list li.cur::before { content: ""; position: absolute; left: -6px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--act);
  box-shadow: 0 0 10px var(--act); }
#layer-list li .pr i.on { background: var(--act); box-shadow: 0 0 6px var(--act); }
#layer-list li.sep { display: block; cursor: default; padding-top: 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-family: var(--display); }
#layer-list li.sep:hover { background: none; }

main.stage { grid-area: stage; position: relative; min-height: 0; overflow: hidden; }
main.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption { position: absolute; left: 18px; top: 12px; right: 18px; pointer-events: none; }
#cap-1 { font-size: 19px; font-weight: 600; letter-spacing: .01em; }
#cap-1 .k { font-family: var(--mono); font-size: 15px; color: var(--act); margin-left: 8px; }
#cap-2 { color: var(--dim); font-size: 13px; margin-top: 2px; min-height: 19px; }
#cap-2 b { color: var(--ink); font-weight: 600; }
#cap-2 code, .explain code { font-family: var(--mono); font-size: .92em; color: var(--ink); }

aside.explain { grid-area: explain; overflow-y: auto; min-height: 0; padding: 0 0 14px; scrollbar-width: thin; }
.ex-h { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 8px;
  background: var(--panel2); border-bottom: 1px solid var(--line); z-index: 1; border-radius: 10px 10px 0 0; }
.ex-tag { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.follow { border: 1px solid var(--line2); background: transparent; border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; color: var(--dim); }
.follow.on { color: var(--act); border-color: color-mix(in srgb, var(--act) 50%, transparent); }
.ex-b { padding: 12px 16px 0; }
.ex-b h2 { margin: 2px 0 4px; font-size: 20px; font-weight: 600; line-height: 1.2; }
.ex-b .key { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 10px; word-break: break-all; }
.ex-b .sum { font-size: 15px; color: var(--ink); margin: 0 0 12px; padding-left: 10px; border-left: 2px solid var(--act); }
.ex-b p { margin: 0 0 10px; color: color-mix(in srgb, var(--ink) 82%, var(--dim)); }
.ex-b ul { margin: 0 0 10px; padding-left: 18px; color: color-mix(in srgb, var(--ink) 82%, var(--dim)); }
.ex-b li { margin: 2px 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 4px 0 14px; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: color-mix(in srgb, var(--bg) 55%, transparent); font-size: 12px; }
.facts dt { color: var(--dim); }
.facts dd { margin: 0; font-family: var(--mono); font-size: 11.5px; text-align: right; overflow-wrap: anywhere; }
.specs { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 8px; }
.specs span { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--state) 55%, transparent); color: var(--state); }
.src { font-family: var(--mono); font-size: 11px; color: var(--faint); overflow-wrap: anywhere; }
.missing { border: 1px dashed var(--line2); border-radius: 8px; padding: 10px 12px; color: var(--dim); font-size: 12.5px; margin-bottom: 12px; }
.legend { display: grid; grid-template-columns: 14px 1fr; gap: 6px 8px; align-items: center; margin: 4px 0 14px; font-size: 12.5px; color: var(--dim); }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }

section.timeline { grid-area: tl; padding: 8px 12px 10px; display: grid; gap: 6px; }
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tbtn { width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.tbtn svg { width: 15px; height: 15px; fill: currentColor; }
.tbtn.play { width: 44px; background: color-mix(in srgb, var(--act) 16%, transparent); border-color: color-mix(in srgb, var(--act) 55%, transparent); }
.tbtn:hover { filter: brightness(1.3); }
.clock { font-family: var(--mono); font-size: 13px; min-width: 210px; padding: 0 6px; }
.clock b { font-weight: 600; }
.clock span { color: var(--dim); }
.speed { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 12px; color: var(--dim); }
.speed output { font-family: var(--mono); color: var(--ink); min-width: 168px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 170px; height: 4px; background: var(--line2); border-radius: 2px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--act); box-shadow: 0 0 8px var(--act); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--act); cursor: pointer; }
.loop { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); cursor: pointer; }
#overview { width: 100%; height: 78px; display: block; cursor: pointer; }
#detail { width: 100%; height: 178px; display: block; }
.tip { position: fixed; z-index: 10; pointer-events: none; max-width: 340px; padding: 7px 10px; border-radius: 7px; font-size: 12px;
  background: var(--panel2); border: 1px solid var(--line2); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.tip b { font-weight: 600; }
.tip code { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.drop { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20; }
.drop div { border: 2px dashed var(--line2); border-radius: 14px; padding: 40px 48px; text-align: center; color: var(--dim); max-width: 520px; }
.drop h2 { color: var(--ink); margin: 0 0 8px; font-weight: 600; }
:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }

@media (max-width: 1180px) {
  #app { height: auto; grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: auto 560px auto auto;
    grid-template-areas: "top top" "layers stage" "tl tl" "explain explain"; }
  aside.layers { max-height: 560px; }
}
@media (max-width: 760px) {
  header.top { flex-direction: column; align-items: stretch; gap: 10px; }
  .chips { flex: none; }
  .modes, .badge { align-self: flex-start; }
  #app { padding: 8px 16px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 520px auto auto auto;
    grid-template-areas: "top" "stage" "tl" "explain" "layers"; }
  aside.layers { max-height: 320px; }
  .speed { margin-left: 0; }
  .speed output { min-width: 0; }
  input[type=range] { width: 120px; }
  h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>
      <div style="min-width:0"><div class="eyebrow">OpenFlowLM · flow viz</div><h1 id="m-name">—</h1></div></div>
    <div class="chips" id="m-chips"></div>
    <div class="modes" role="group" aria-label="Route">
      <button class="mode on" id="mode-decode" aria-pressed="true">Decode · one token</button>
      <button class="mode" id="mode-prefill" disabled title="The prefill timeline arrives with VIZ-TIMELINE-PREFILL">Prefill</button>
    </div>
    <button class="badge" id="b-modelled" title="What is real here and what is modelled">Modelled timing</button>
    <button class="icon" id="b-theme" aria-label="Switch light or dark theme">◐</button>
  </header>

  <aside class="layers panel" aria-label="Layers">
    <div class="sec-h">Model <span id="l-count"></span></div>
    <ol id="layer-list"></ol>
  </aside>

  <main class="stage panel">
    <canvas id="stage" role="img" aria-label="The NPU array, system memory and host CPU, with data streams animated"></canvas>
    <div class="caption"><div id="cap-1"></div><div id="cap-2"></div></div>
  </main>

  <aside class="explain panel" id="explain" aria-live="polite"></aside>

  <section class="timeline panel" aria-label="Timeline">
    <div class="transport">
      <button class="tbtn" id="t-prev" aria-label="Previous event (Left arrow)"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="tbtn play" id="t-play" aria-label="Play or pause (Space)"><svg viewBox="0 0 16 16" id="i-play"><path d="M4 2l10 6-10 6z"/></svg></button>
      <button class="tbtn" id="t-stop" aria-label="Stop and rewind (Home)"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg></button>
      <button class="tbtn" id="t-next" aria-label="Next event (Right arrow)"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
      <div class="clock" id="clock"></div>
      <label class="loop"><input type="checkbox" id="t-loop"> loop</label>
      <div class="speed"><label for="t-speed">speed</label><input type="range" id="t-speed" min="0" max="1000" value="600"><output id="t-speed-o"></output></div>
    </div>
    <canvas id="overview" aria-label="The whole decode step: NPU, CPU and GPU lanes; click to seek"></canvas>
    <canvas id="detail" aria-label="The current dispatch: each DMA stream and core over time"></canvas>
  </section>
</div>
<div class="tip" id="tip" hidden></div>
<div class="drop" id="drop" hidden><div><h2>Drop a viz.json</h2>
  <p>This page normally opens with its data inlined by <code>oflm viz &lt;model&gt;</code>. For development, drop a kernel set's <code>viz.json</code> here, together with the <code>src/viz/explain/*.md</code> files.</p></div></div>

<script id="viz-data" type="application/json">/*VIZ_DATA*/</script>
<script id="viz-explain" type="text/plain">/*VIZ_EXPLAIN*/</script>
<script id="viz-model" type="application/json">/*VIZ_MODEL*/</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS = ['bg', 'bg2', 'panel2', 'line', 'line2', 'ink', 'dim', 'faint', 'tile', 'tileEdge', 'tileUsed', 'weight', 'act',
  'state', 'out', 'host', 'ctx', 'lin', 'att', 'tail', 'idle', 'playhead'];
let C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of COLORS) C[k] = cs.getPropertyValue('--' + k).trim();
  C.mono = cs.getPropertyValue('--mono').trim();
  C.light = cs.getPropertyValue('color-scheme').trim() === 'light';
  C.display = cs.getPropertyValue('--display').trim();
}
function alpha(col, a) {
  if (col.startsWith('#')) {
    const n = parseInt(col.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }
  return col;
}
const fmtT = us => us >= 1000 ? (us / 1000).toFixed(us >= 10000 ? 2 : 3) + ' ms' : us >= 1 ? us.toFixed(us >= 100 ? 0 : 1) + ' µs' : (us * 1000).toFixed(0) + ' ns';
const fmtB = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(b >= 1e7 ? 1 : 2) + ' MB' : b >= 1e3 ? (b / 1e3).toFixed(1) + ' KB' : b + ' B';

function blob(id) {
  const el = document.getElementById(id);
  const t = el ? el.textContent.trim() : '';
  return !t || t.startsWith('/*VIZ_') ? null : t.replace(/<\\\//g, '</');
}

// ---- explainers: "## kind:key" sections with Title / Summary / Spec / Source lines
function parseExplain(text) {
  const map = new Map(), globs = [];
  const parts = ('\n' + (text || '')).split(/\n## +/).slice(1);
  for (const part of parts) {
    const lines = part.split('\n');
    const key = lines.shift().trim();
    const e = { key, title: '', summary: '', spec: [], source: '', body: [] };
    let head = true;
    for (const ln of lines) {
      const m = head && ln.match(/^(Title|Summary|Spec|Source):\s*(.*)$/);
      if (m) {
        if (m[1] === 'Spec') e.spec = m[2].split(/[,\s]+/).filter(Boolean);
        else e[m[1].toLowerCase()] = m[2].trim();
        continue;
      }
      if (head && !ln.trim()) continue;
      head = false;
      e.body.push(ln);
    }
    e.body = e.body.join('\n').trim();
    if (key.includes('*')) globs.push([new RegExp('^' + key.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*') + '$'), e]);
    else map.set(key, e);
  }
  return { get(k) { if (map.has(k)) return map.get(k); for (const [re, e] of globs) if (re.test(k)) return e; return null; } };
}
function md(src) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
  const out = [];
  for (const block of src.split(/\n\s*\n/)) {
    let para = [], items = null;
    const flush = () => {
      if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
      if (items) out.push('<ul>' + items.map(i => '<li>' + inline(i) + '</li>').join('') + '</ul>');
      para = []; items = null;
    };
    for (const l of block.split('\n')) {
      if (!l.trim()) continue;
      if (/^\s*[-*] /.test(l)) {
        if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; }
        (items = items || []).push(l.replace(/^\s*[-*] /, ''));
      } else if (items && /^\s+/.test(l)) items[items.length - 1] += ' ' + l.trim();
      else { if (items) flush(); para.push(l.trim()); }
    }
    flush();
  }
  return out.join('');
}

// ---- state
let V, D, S, EV, TOTAL, EXP, MODEL = {};
const st = { t: 0, playing: false, speed: 1000, flow: 0, loop: false, follow: true, touched: false, sel: null, hover: null, last: 0, layerHover: false };
const KIND_COLOR = k => ({ weight: C.weight, act: C.act, state: C.state }[k] || C.act);

function fnColor(fn) {
  if (/^lm_head/.test(fn)) return C.tail;
  if (/^gemv|^gemm|^mm/.test(fn)) return C.weight;
  if (/^dnx|^dn_|^delta/.test(fn)) return C.state;
  if (/^attn/.test(fn)) return C.att;
  if (/^moe/.test(fn)) return C.out;
  if (/^router/.test(fn)) return C.host;
  if (/^glue|^post/.test(fn)) return C.lin;
  return C.act;
}

    if (!hit && img) {
      let best = 6;
      for (const p of G.paths) for (let i = 1; i < p.pts.length; i++) { const d = distSeg(x, y, p.pts[i - 1], p.pts[i]); if (d < best) { best = d; hit = { kind: 'fifo', fi: p.fi, name: p.name }; } }
    }
    if (!hit && G.bufs) for (const b of G.bufs) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) hit = { kind: 'buffer', name: b.nm };
    const inR = R => x >= R.x && x <= R.x + R.w && y >= R.y && y <= R.y + R.h;
    if (!hit && inR(G.cpu)) hit = L.host ? { kind: 'event', ev: L.host } : { kind: 'concept', key: 'host' };
    if (!hit && inR(G.gpu)) hit = { kind: 'concept', key: 'gpu' };
    if (!hit && inR(G.ddr)) hit = { kind: 'concept', key: 'ddr' };
    if (hit) html = hoverHtml(hit, L);
  } else if (id === 'overview') {
    const t = (x - OV.left) / OV.w * TOTAL;
    for (const [lane, ln] of Object.entries(OV.lanes)) if (y >= ln[0] - 2 && y <= ln[0] + ln[1] + 2) {
      if (lane === 'gpu') { hit = { kind: 'concept', key: 'gpu' }; html = '<b>iGPU</b> · oflm runs nothing here'; break; }
      const evs = EV.filter(ev => ev.lane === lane && ev.t0 <= t && t <= ev.t1 + TOTAL / OV.w);
      if (evs.length) { const ev = evs[0]; hit = { kind: 'ovev', ev }; html = evHtml(ev); }
    }
    if (click) { if (hit && hit.ev) { seek(hit.ev.t0 + 0.0005); select({ kind: 'event', ev: hit.ev }); } else if (hit) select(hit); return; }
  } else if (id === 'detail' && DT.rows) {
    const row = DT.rows.find(r => y >= r.y && y < r.y + r.h);
    const tau = (x - DT.left) / DT.w * DT.dur;
    if (row && L.tpl) {
      const k = clamp(Math.floor((y - row.y - 1) / ((row.h - 2) / row.mem.length)), 0, row.mem.length - 1);
      if (row.kind === 'f') {
        const fi = row.mem[k];
        const tk = L.tpl.tasks.find(q => q[0] === fi && q[1] - 2 <= tau && tau <= q[2] + 2);
        const f = L.img.fifos[fi];
        hit = { kind: 'fifo', fi, name: f.name };
        html = `<b>${esc(f.name)}</b> · ${f.elem_bytes} B elements, depth ${f.depth}` + (tk ? `<br>${esc(taskLabel(tk, L.ev))} <code>${esc(S[tk[4]])}</code><br>${fmtB(tk[3])} in ${fmtT(tk[2] - tk[1])} (${(tk[3] / Math.max(1e-6, tk[2] - tk[1]) / 1000).toFixed(1)} GB/s)` : '');
      } else {
        const ci = row.mem[k];
        const sp = L.tpl.spans.find(q => q[0] === ci && q[2] - 2 <= tau && tau <= q[3] + 2);
        const cr = L.img.cores[ci];
        hit = sp ? { kind: 'core', fn: S[sp[1]], tile: cr.tile } : { kind: 'tile', c: cr.tile[0], r: cr.tile[1] };
        html = `<b>core ${cr.tile.join(',')}</b>` + (sp ? `<br><code>${esc(S[sp[1]])}</code> ×${sp[4]} · ${fmtT(sp[3] - sp[2])}` : '');
      }
    }
    if (click && !hit && x > DT.left) { seek(L.ev.t0 + clamp(tau, 0, DT.dur)); return; }
  }
  st.hover = hit;
  tip(html, e);
  if (click && hit) select(hit.kind === 'ovev' ? { kind: 'event', ev: hit.ev } : hit);
}
function evHtml(ev) {
  const nm = ev.kind === 'ctx' ? 'context switch ' + ev.name : ev.kind === 'host' ? 'host · ' + ev.name : ev.name;
  return `<b>${esc(nm)}</b>${ev.layer != null ? ' · layer ' + ev.layer : ''}<br>${fmtT(ev.t1 - ev.t0)} at ${fmtT(ev.t0)}` + (ev.tpl ? ` · ${fmtB(D.templates[ev.tpl].bytes)}` : '');
}
function hoverHtml(hit, L) {
  const img = L.img;
  if (hit.kind === 'tile') {
    const kind = hit.r === 0 ? 'shim tile' : hit.r === 1 ? 'memory tile' : 'compute core';
    let s = `<b>${kind} ${hit.c},${hit.r}</b>`;
    if (img) {
      const ci = img.cores.findIndex(q => q.tile[0] === hit.c && q.tile[1] === hit.r);
      if (ci >= 0) {
        const sp = L.spans.find(q => q[0] === ci);
        s += sp ? `<br>running <code>${esc(S[sp[1]])}</code>` : '<br>idle now';
        s += `<br><code>${esc(img.cores[ci].funcs.slice(0, 6).join(' · '))}${img.cores[ci].funcs.length > 6 ? ' …' : ''}</code>`;
      } else if (!img.tiles.some(t => t[0] === hit.c && t[1] === hit.r)) s += '<br>not used by this image';
    }
    return s;
  }
  if (hit.kind === 'fifo') {
    const f = (img || D.images[L.ghostImg]).fifos[hit.fi];
    const a = L.tasks.filter(x => x[0] === hit.fi);
    return `<b>stream ${esc(f.name)}</b> · ${f.src.join(',')} → ${f.dst.map(d => d.join(',')).join(' ')}<br>${f.elem_bytes} B elements · depth ${f.depth}` + (a.length ? `<br>now: ${esc(taskLabel(a[0], L.ev))}` : '');
  }
  if (hit.kind === 'buffer') return `<b>${esc(hit.name)}</b> · a DDR buffer this dispatch reads or writes`;
  if (hit.kind === 'event') return evHtml(hit.ev);
  if (hit.kind === 'concept') return `<b>${esc(hit.key)}</b>`;
  return null;
}

// ---- explainer panel
function select(sel) { st.sel = sel; st.follow = false; renderExplain(); }
let followKey = '';
let followAt = 0;
function followExplain(L) {
  const k = L.ev.kind + ':' + (L.ev.tpl || L.ev.name) + ':' + (L.ev.layer ?? '');
  if (k === followKey) return;
  const now = performance.now();
  if (st.playing && now - followAt < 3500) return;
  followAt = now;
  followKey = k;
  renderExplain(L.ev);
}
function designOf(k) { const d = V.kernels[k] && V.kernels[k].design; return d ? d.split('/').pop().replace(/\.py$/, '') : null; }
function lookup(sel, ev) {
  if (!sel) return null;
  if (sel.kind === 'event') {
    const e = sel.ev;
    if (e.kind === 'dispatch') {
      const base = EXP.get('dispatch:' + e.name), variant = EXP.get(`dispatch:${e.name}@${designOf(e.name)}`);
      return { tag: 'Dispatch', key: `dispatch:${e.name}`, e: base || variant, extra: base && variant ? variant : null };
    }
    if (e.kind === 'host') return { tag: 'Host stage', key: 'host:' + e.name, e: EXP.get('host:' + e.name) };
    return { tag: 'Context switch', key: 'concept:ctx', e: EXP.get('concept:ctx') };
  }
  if (sel.kind === 'core') return { tag: 'Core function', key: 'core:' + sel.fn, e: EXP.get('core:' + sel.fn) };
  if (sel.kind === 'tile') {
    const L = live(), img = L.img;
    if (sel.r >= 2 && img) {
      const ci = img.cores.findIndex(q => q.tile[0] === sel.c && q.tile[1] === sel.r);
      const sp = ci >= 0 ? L.spans.find(q => q[0] === ci) : null;
      if (sp) return { tag: 'Core function', key: 'core:' + S[sp[1]], e: EXP.get('core:' + S[sp[1]]), tile: [sel.c, sel.r] };
    }
    const key = sel.r === 0 ? 'concept:shim' : sel.r === 1 ? 'concept:mem' : 'concept:core';
    return { tag: 'Tile', key, e: EXP.get(key), tile: [sel.c, sel.r] };
  }
  if (sel.kind === 'fifo') return { tag: 'Data stream', key: 'fifo:' + sel.name, e: EXP.get('fifo:' + sel.name) };
  if (sel.kind === 'buffer') return { tag: 'DDR buffer', key: 'buffer:' + sel.name, e: EXP.get('buffer:' + sel.name) };
  if (sel.kind === 'layer') return { tag: 'Layer', key: 'layer:' + V.layers[sel.layer], e: EXP.get('layer:' + V.layers[sel.layer]) };
  if (sel.kind === 'concept') return { tag: 'Concept', key: 'concept:' + sel.key, e: EXP.get('concept:' + sel.key) };
  return null;
}
function facts(sel, L) {
  const f = [];
  if (sel.kind === 'event') {
    const e = sel.ev;
    if (e.layer != null) f.push(['layer', `${e.layer} · ${LT_NAME[V.layers[e.layer]] || V.layers[e.layer]}`]);
    f.push(['duration', fmtT(e.t1 - e.t0) + ' (modelled)']);
    f.push(['starts at', fmtT(e.t0) + ' into the step']);
    if (e.kind === 'dispatch') {
      const tp = D.templates[e.tpl], k = V.kernels[e.name];
      f.push(['DDR traffic', `${fmtB(tp.bytes)} · ${(tp.bytes / tp.dur / 1000).toFixed(1)} GB/s`]);
      f.push(['DMA tasks', tp.tasks.length]);
      f.push(['cores', D.images[tp.image].cores.length]);
      f.push(['context', k.context]);
      if (k.design) f.push(['design', k.design]);
      if (k.patch) f.push(['patched by host', k.patch]);
      if (e.experts) f.push(['routed experts', e.experts.join(' ') + ' (illustrative)']);
    }
  } else if (sel.kind === 'core' || (sel.kind === 'tile' && L.img)) {
    const img = L.img;
    const tile = sel.tile || [sel.c, sel.r];
    if (img) {
      const ci = img.cores.findIndex(q => q.tile[0] === tile[0] && q.tile[1] === tile[1]);
      f.push(['tile', tile.join(',')]);
      if (ci >= 0) {
        const fn = sel.fn || (L.spans.find(q => q[0] === ci) ? S[L.spans.find(q => q[0] === ci)[1]] : null);
        const sps = L.tpl ? L.tpl.spans.filter(q => q[0] === ci && (!fn || S[q[1]] === fn)) : [];
        if (fn) f.push(['calls this dispatch', sps.reduce((s, q) => s + q[4], 0)]);
        f.push(['functions on this core', img.cores[ci].funcs.join(', ')]);
      }
    }
  } else if (sel.kind === 'fifo') {
    const img = L.img || (L.ghostImg && D.images[L.ghostImg]);
    if (img) {
      const fi = img.fifos.findIndex(q => q.name === sel.name);
      if (fi >= 0) {
        const fo = img.fifos[fi];
        f.push(['from', fo.src.join(',') + (fo.src[1] === 0 ? ' (shim)' : '')]);
        f.push(['to', fo.dst.map(d => d.join(',')).join('  ')]);
        f.push(['element', `${fo.elem_bytes} B × depth ${fo.depth}`]);
        if (L.tpl) f.push(['bytes this dispatch', fmtB(L.tpl.tasks.filter(x => x[0] === fi).reduce((s, x) => s + x[3], 0))]);
      }
    }
  } else if (sel.kind === 'layer') {
    const evs = EV.filter(e => e.layer === sel.layer);
    f.push(['type', LT_NAME[V.layers[sel.layer]] || V.layers[sel.layer]]);
    f.push(['program', V.layer_types[V.layers[sel.layer]].program.map(s => s.op === 'run' ? s.kernel : s.op).join(' → ')]);
    f.push(['time', fmtT(evs.reduce((s, e) => s + e.t1 - e.t0, 0)) + ' (modelled)']);
    f.push(['DDR traffic', fmtB(evs.filter(e => e.tpl).reduce((s, e) => s + D.templates[e.tpl].bytes, 0))]);
  } else if (sel.kind === 'concept' && sel.key === 'modelled') {
    const cal = D.calibration;
    f.push(['DDR bandwidth', cal.bw_gbps + ' GB/s (fitted)']);
    f.push(['context switch', fmtT(cal.ctx_switch_us)]);
    f.push(['step', fmtT(TOTAL) + ' at position ' + D.position]);
  }
  return f.length ? '<dl class="facts">' + f.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') + '</dl>' : '';
}
function intro() {
  const cal = D.calibration;
  return `<div class="ex-h"><span class="ex-tag">About this view</span><button class="follow on" id="ex-follow">following</button></div>
  <div class="ex-b"><h2>One decode step, slowed down</h2>
  <p class="sum">Every dispatch, DMA stream and core function below comes from the compiled kernel set. Durations are modelled.</p>
  <div class="legend"><i style="background:${C.weight}"></i>weights streaming from DDR<i style="background:${C.act}"></i>activations in<i style="background:${C.state}"></i>recurrent state / KV cache<i style="background:${C.out}"></i>results back to DDR<i style="background:${C.host}"></i>host CPU work</div>
  <p>Press <span class="kbd">Space</span> to play, <span class="kbd">←</span> <span class="kbd">→</span> to step between events, and click any tile, stream, buffer, layer or timeline block to read about it.</p>
  <p>Timing: ${cal.bw_gbps} GB/s effective DDR bandwidth, fitted to a measured step. <a href="#" id="ex-modelled" style="color:var(--weight)">What is modelled?</a></p></div>`;
}
function renderExplain(followEv) {
  const box = $('#explain');
  const L = live();
  const sel = st.follow ? (followEv ? { kind: 'event', ev: followEv } : null) : st.sel;
  if (!sel) { box.innerHTML = intro(); wireExplain(); return; }
  const r = lookup(sel);
  const e = r && r.e;
  let html = `<div class="ex-h"><span class="ex-tag">${esc(r ? r.tag : '')}</span><button class="follow${st.follow ? ' on' : ''}" id="ex-follow">${st.follow ? 'following' : 'follow playback'}</button></div><div class="ex-b">`;
  const titleOf = () => {
    if (e && e.title) return e.title;
    if (sel.kind === 'event') return sel.ev.name;
    if (sel.kind === 'core') return sel.fn;
    return r ? r.key.split(':')[1] : '';
  };
  html += `<h2>${esc(titleOf())}</h2><div class="key">${esc(r ? r.key : '')}${sel.kind === 'event' && sel.ev.layer != null ? ' · layer ' + sel.ev.layer : ''}</div>`;
  if (e) {
    if (e.summary) html += `<p class="sum">${esc(e.summary)}</p>`;
    html += facts(sel, L);
    html += md(e.body);
    if (r.extra && r.extra.body) html += `<p><b>In this build (${esc(designOf(sel.ev.name))}):</b></p>` + md(r.extra.body);
    if (e.spec.length) html += `<div class="specs">${e.spec.map(s => `<span>${esc(s)}</span>`).join('')}</div>`;
    if (e.source) html += `<div class="src">${esc(e.source)}</div>`;
  } else {
    html += facts(sel, L);
    html += `<div class="missing">No explainer for <code>${esc(r ? r.key : '?')}</code> yet. Explainers live in <code>src/viz/explain/*.md</code>.</div>`;
  }
  box.innerHTML = html + '</div>';
  wireExplain();
}
function wireExplain() {
  const f = $('#ex-follow');
  if (f) f.onclick = () => { st.follow = !st.follow; followKey = ''; if (!st.follow) st.sel = st.sel || { kind: 'event', ev: live().ev }; renderExplain(st.follow ? live().ev : null); };
  const m = $('#ex-modelled');
  if (m) m.onclick = ev => { ev.preventDefault(); select({ kind: 'concept', key: 'modelled' }); };
}

const th = loadPref('theme');
if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readColors(); });
boot();
})();
</script>
</body>
