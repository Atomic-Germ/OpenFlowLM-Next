baseURL = "https://openflowlm.org/"
languageCode = "en-US"
title = "OpenFlowLM"
enableEmoji = false
enableGitInfo = true

[build]
  noJSConfigInAssets = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.140.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "docs"
    target = "content/docs"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

[params]
  description = "Run local AI models on AMD Ryzen AI NPUs: chat, vision, embeddings, speech, and image generation while keeping your CPU and GPU free."
  cb_api = "/api"
  discord_url = "https://discord.gg/AcFAKvVV8c"
  github_url = "https://github.com/Atomic-Germ/OpenFlowLM-Next"
  releases_url = "https://github.com/Atomic-Germ/OpenFlowLM-Next/releases"

  google_fonts = [
    ["Inter", "400, 500, 600, 700"],
    ["JetBrains Mono", "400, 500, 600"]
  ]
  sans_serif_font = "Inter"
  secondary_font = "Inter"
  mono_font = "JetBrains Mono"

  [params.footer]
    copyright = "© :YEAR: OpenFlowLM Contributors. Independent open-source project; unaffiliated with AMD."
    version = false

  [params.social]
    github = "Atomic-Germ/OpenFlowLM-Next"

  [params.docs]
    title = "OpenFlowLM Docs"
    themeColor = "blue"
    darkMode = true
    prism = true
    prismTheme = "lotusdocs"
    repoURL = "https://github.com/Atomic-Germ/OpenFlowLM-Next"
    repoBranch = "main"
    editPage = true
    lastMod = true
    lastModRelative = true
    toc = true
    tocMobile = true
    scrollSpy = true
    sidebarIcons = true
    titleIcon = true
    breadcrumbs = true
    navDesc = true
    navDescTrunc = 52
    listDescTrunc = 110
    backToTop = true
    descriptions = true
    intLinkTooltip = false
    extLinkNewTab = true

  [params.flexsearch]
    enabled = true
    searchSectionsIndex = "ALL"
    maxResult = 8

  [params.render_hooks]
    [params.render_hooks.link]
      errorLevel = "warning"

[[menu.primary]]
  name = "Models"
  url = "/models/"
  identifier = "models"
  weight = 10

[[menu.primary]]
  name = "Engines"
  url = "/engines/"
  identifier = "engines"
  weight = 20

[[menu.primary]]
  name = "Benchmarks"
  url = "/benchmarks/"
  identifier = "benchmarks"
  weight = 30

[[menu.primary]]
  name = "Docs"
  url = "/docs/"
  identifier = "docs"
  weight = 40

[[menu.primary]]
  name = "Community"
  url = "/team/"
  identifier = "community"
  weight = 50
