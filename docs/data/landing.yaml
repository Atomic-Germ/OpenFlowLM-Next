featureGrid:
  oflm: true
  enable: true
  weight: 20
  template: "feature grid"
  title: "Built for Everyday Local AI on Ryzen AI"
  subtitle: "Run background assistants, document search, voice transcription, and image tools directly on your built-in NPU."
  items:
    - title: "Keep CPU & GPU Free"
      icon: "memory"
      description: "Offload AI inference to the dedicated Ryzen AI NPU so your processor, graphics card, and laptop fans stay quiet while you code, browse, or game."
      ctaLink:
        text: "How NPU runtimes work"
        url: "/engines/"
    - title: "Bring Any Compatible GGUF"
      icon: "bolt"
      description: "Download ready-to-run models with `oflm pull` or install standard Hugging Face GGUF checkpoints and fine-tunes in one command with `oflm add`."
      ctaLink:
        text: "Browse supported models"
        url: "/models/"
    - title: "Chat, Vision, Voice & Images"
      icon: "hub"
      description: "Ask questions about images, transcribe audio with Whisper, index documents with fast batched embeddings, and generate or edit images with FLUX.2."
      ctaLink:
        text: "Read model guides"
        url: "/docs/models/"
    - title: "Long-Context & Large Models"
      icon: "psychology"
      description: "Take advantage of unified memory on Ryzen AI 300 and AI Max systems to run 27B dense and 35B-A3B MoE reasoning models locally."
      ctaLink:
        text: "See measured speeds"
        url: "/benchmarks/"
    - title: "Local OpenAI & Anthropic API"
      icon: "dns"
      description: "`oflm serve` runs a local server compatible with Open WebUI, Continue, Claude Code, and OpenAI SDKs."
      ctaLink:
        text: "Server & app guides"
        url: "/docs/instructions/server/"
    - title: "Windows & Linux"
      icon: "inventory_2"
      description: "Install in minutes with the Windows MSI installer, or via DEB, RPM, Docker, and NixOS on Linux."
      ctaLink:
        text: "Installation guides"
        url: "/docs/install/"
