name: CMake Configure, Build, Test

on:
  push:
    branches: [ "main","feat/**","bugfix/**" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pulls
      uses: actions/checkout@v4

    - name: Submodules
      uses: snickerbockers/submodules-init@v4
    
    - name: Sets up Ninja-build
      uses: wirekang/setup-ninja@v1
      with:
        platform: linux

    - name: Installs Deps
      run:
        sudo add-apt-repository -y ppa:amd-team/xrt && \
        sudo apt-get update && \
        sudo apt-get install -y \
            libxrt-dev \
            libxrt2 \
            libxrt-npu2 \
            libboost-all-dev \
            uuid-dev \
            libdrm-dev \
            cmake \
            g++ \
            libreadline-dev \
            libcurl4-openssl-dev \
            libfftw3-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev

    - name: Configures OpenFlowLM
      run: cmake -B ${{github.workspace}}/build --preset linux-${{env.BUILD_TYPE}} -G Ninja -DCMAKE_CXX_FLAGS="-I/usr/include/xrt"

    - name: Builds
      run: cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --preset linux-default
