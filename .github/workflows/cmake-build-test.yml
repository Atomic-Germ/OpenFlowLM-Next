name: CMake Configure, Build, Test

on:
  push:
    branches: [ "main","feat/**","bugfix/**" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pulls
      uses: actions/checkout@v4

    - name: Submodules
      uses: snickerbockers/submodules-init@v4
    
    - name: wirekang/setup-ninja
      uses: wirekang/setup-ninja@v1
      with:
        platform: linux

    - name: Configures
      run: cmake -B ${{github.workspace}}/build --preset linux-${{env.BUILD_TYPE}} -G Ninja

    - name: Builds
      run: source ${{github.workspace}}/ironvenv/bin/activate && cmake --build ${{github.workspace}}/build

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --preset linux-default
