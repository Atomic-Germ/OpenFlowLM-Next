name: CMake Configure, Build, Test

on:
  push:
    branches:
      - main
      - "feat/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main

env:
  BUILD_TYPE: debug

permissions:
  contents: read

jobs:
  config-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            libboost-all-dev \
            uuid-dev \
            libdrm-dev \
            cmake \
            ninja-build \
            g++ \
            libreadline-dev \
            libcurl4-openssl-dev \
            libfftw3-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev

          sudo add-apt-repository -y ppa:amd-team/xrt
          sudo apt-get update
          sudo apt-get install -y \
            libxrt-dev \
            libxrt2 \
            libxrt-npu2

      - name: Verify tools
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure
        run: |
          cmake --preset linux-${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_FLAGS="-I/usr/include/xrt"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
